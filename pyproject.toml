[project]
name = "fraud-detection-ml-service"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "ipykernel>=6.31.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "uvicorn>=0.39.0",
]

[project.scripts]
fraud-detection-ml-service = "fraud_detection_ml_service:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
